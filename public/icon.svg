<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.3" />

  <!-- Crescent & Sound Waves Emblem -->
  <path d="M 280 140 A 120 120 0 1 0 350 340 A 100 100 0 1 1 280 140 Z" fill="url(#gold)" filter="url(#glow)" />
  
  <!-- Star / Sparkle in Crescent -->
  <path d="M 330 210 L 335 225 L 350 230 L 335 235 L 330 250 L 325 235 L 310 230 L 325 225 Z" fill="#ffffff" />
  
  <!-- Audio wave bars in center -->
  <rect x="200" y="235" width="8" height="42" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="216" y="215" width="8" height="82" rx="4" fill="#ffffff" opacity="0.95" />
  <rect x="232" y="200" width="8" height="112" rx="4" fill="#ffffff" />
  <rect x="248" y="225" width="8" height="62" rx="4" fill="#ffffff" opacity="0.9" />
</svg>
